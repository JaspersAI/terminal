<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- frame-src is the two schemes main serves a frame from: a plugin's view, and a server's own page for
         one of its tools. img-src adds jaspers-plugin: for main's verified plugin icon cache. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' jaspers-plugin:; frame-src jaspers-plugin: jaspers-app:"
    />
    <title>Jaspers Terminal</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
