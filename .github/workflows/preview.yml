name: Preview

# A pull request from Ship gets a build to try on each platform: a DMG built on a macOS runner and a
# Windows installer built on a Windows runner, both uploaded to a public Vercel Blob store, and one
# comment on the pull request links to both. The Windows installer is also installed and opened by
# the packaged-app smoke test, the only run of a pull request's code on Windows before a release.
# Only Ship's branches build; deleting the two jobs' `if:` builds every pull request.
#
# It also runs by hand on a branch, main included, for a build of what is merged rather than of one
# pull request: Actions > Preview > Run workflow, or `gh workflow run preview.yml --ref main`. There
# is no pull request to comment on then, so the links go in the run's summary.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# One build per pull request: a newer push cancels the older run.
concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Empty when run by hand: the upload names the build after the branch instead.
  PR: ${{ github.event.pull_request.number }}
  SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  REF: ${{ github.ref_name }}

jobs:
  dmg:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'ship/')
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      url: ${{ steps.upload.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The DMG electron-builder.yml makes, ad-hoc signed rather than with the Developer ID, whose
      # certificate stays away from a pull request's code: only release.yml has it. Never published:
      # the upload below is the only place it goes. electron-builder skips signing in a pull
      # request's build unless told otherwise, and a Mac that downloads an unsigned app calls it
      # damaged instead of offering Open Anyway. An ad-hoc signature cannot satisfy the hardened
      # runtime, so that is off too.
      - run: npm run dist -- --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false
        env:
          CSC_FOR_PULL_REQUEST: true
      # An unsigned app is a DMG that will not open: fail here rather than on his Mac.
      - run: codesign --verify --deep --strict 'dist/mac-arm64/Jaspers Terminal.app'
      - name: Upload the DMG
        id: upload
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          # Assigned first: a failed upload inside echo's argument would not fail the step.
          url=$(node scripts/upload-preview.mjs dist/*.dmg)
          echo "url=$url" >> "$GITHUB_OUTPUT"

  windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'ship/')
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      url: ${{ steps.upload.outputs.url }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The installer electron-builder.yml makes, unsigned: the Azure Artifact Signing secrets stay
      # away from a pull request's code, as only release.yml has them. signExecutable=false skips
      # the signing alone, so the icon and version details are still written into the executables,
      # and app-update.yml still names the publisher that signs the real releases.
      - run: npm run dist -- --publish never -c.win.signExecutable=false
      # Uploaded before the smoke test, so a build that fails it can still be looked at.
      - name: Upload the installer
        id: upload
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          # Assigned first: a failed upload inside echo's argument would not fail the step.
          url=$(node scripts/upload-preview.mjs dist/Jaspers-Terminal-Setup-*.exe)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # The same smoke test a release passes: installed silently into a folder of its own, the app
      # has to open, get through setup, and put a view on the grid.
      - name: The installed app runs
        env:
          SMOKE_DIR: ${{ runner.temp }}/smoke
        run: INSTALLER=$(ls dist/Jaspers-Terminal-Setup-*.exe) npm run test:packaged
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-test-windows
          path: ${{ runner.temp }}/smoke/packaged.png
          if-no-files-found: ignore

  # One comment per pull request, edited to point at the latest builds; run by hand, the run's
  # summary instead. Written once both builds have ended, whichever way, so a failed one is said.
  links:
    needs: [dmg, windows]
    if: always() && needs.dmg.result != 'skipped' && needs.dmg.result != 'cancelled' && needs.windows.result != 'cancelled'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      MAC_URL: ${{ needs.dmg.outputs.url }}
      MAC_RESULT: ${{ needs.dmg.result }}
      WIN_URL: ${{ needs.windows.outputs.url }}
      WIN_RESULT: ${{ needs.windows.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Write the links
        run: |
          if [ -n "$PR" ]; then title="Jaspers Terminal for PR #$PR"; from="${SHA:0:7}"; else title="Jaspers Terminal"; from="\`$REF\` at ${SHA:0:7}"; fi
          if [ -n "$MAC_URL" ]; then
            mac="**[Download $title for macOS]($MAC_URL)** (Apple Silicon), built from $from."
          else
            mac="The macOS build failed: see [the run]($RUN_URL)."
          fi
          if [ -z "$WIN_URL" ]; then
            win="The Windows build failed: see [the run]($RUN_URL)."
          elif [ "$WIN_RESULT" = success ]; then
            win="**[Download $title for Windows]($WIN_URL)** (x64), built from $from. The installed app passed the smoke test."
          else
            win="**[Download $title for Windows]($WIN_URL)** (x64), built from $from. The installed app **failed the smoke test**: see [the run]($RUN_URL)."
          fi
          cat > "$RUNNER_TEMP/comment.md" <<EOF
          ### Preview build

          $mac

          $win

          The first time you open a build, it says it cannot verify the app. On a Mac, open **System Settings → Privacy & Security**, scroll down, and click **Open Anyway**. On Windows, click **More info**, then **Run anyway**.

          This is the same app as the one you have installed: it replaces it and uses the same data.
          EOF
          if [ -z "$PR" ]; then
            cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --body-file "$RUNNER_TEMP/comment.md" ||
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
